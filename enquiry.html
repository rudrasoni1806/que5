<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Bright Future Academy</title>

<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; color: #243047; background: #f4f7fb; }
    header, nav, main, footer { width: min(100% - 32px, 1000px); margin-left: auto; margin-right: auto; }
    header { margin-top: 24px; padding: 28px; color: white; text-align: center; background: linear-gradient(135deg, #173b68, #3478a8); border-radius: 14px 14px 0 0; }
    header h1 { margin: 0; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 24px; padding: 14px; background: #e4edf7; }
    nav a { color: #174f7b; font-weight: bold; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { padding: 26px; background: white; }
    article { margin: 0 0 26px; padding: 20px; border: 1px solid #dbe4ee; border-radius: 10px; }
    article:last-child { margin-bottom: 0; }
    h2 { margin-top: 0; color: #1d527e; }
    img { display: block; width: 100%; max-height: 430px; object-fit: cover; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; }
    th { background: #eaf2fb; }
    tbody tr:nth-child(even) { background: #f7faff; }
    footer { margin-bottom: 24px; padding: 18px; text-align: center; color: white; background: #173b68; border-radius: 0 0 14px 14px; }
    footer p { margin: 0; }
    .field { margin: 16px 0; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input, select, textarea { width: 100%; max-width: 100%; padding: 10px; border: 1px solid #aebdce; border-radius: 6px; font: inherit; }
    fieldset { margin: 18px 0; border: 1px solid #cbd5e1; border-radius: 8px; }
    fieldset label { display: inline; margin-right: 18px; font-weight: normal; }
    fieldset input { width: auto; }
    button { padding: 10px 18px; margin-right: 8px; border: 0; border-radius: 6px; cursor: pointer; }
    button[type="submit"] { color: white; background: #1d659b; }
    button[type="reset"] { color: #243047; background: #e5edf5; }
    @media (max-width: 600px) { main { padding: 14px; } article { padding: 14px; } table { font-size: 13px; } th, td { padding: 6px; } }
</style>

</head>
<body>
    <header>
        <h1>Bright Future Academy</h1>
    </header>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="faculty.html">Faculty</a>
    </nav>
    <main>
        <article>
            <h2>Student Enquiry Form</h2>
            <p>Please complete this form to enquire about classes at Bright Future Academy.</p>
            <form action="enquiry.html" method="get">
                <p class="field">
                    <label for="student-name">Student name</label>
                    <input type="text" id="student-name" name="student_name" minlength="3" required
                           title="Please enter at least 3 characters for the student name.">
                </p>
                <p class="field">
                    <label for="parent-email">Parent email</label>
                    <input type="email" id="parent-email" name="parent_email" required
                           title="Please enter a valid email address.">
                </p>
                <p class="field">
                    <label for="parent-phone">Parent phone</label>
                    <input type="tel" id="parent-phone" name="parent_phone" pattern="[0-9]{10}"
                           minlength="10" maxlength="10" required
                           title="Please enter exactly 10 digits, using numbers 0 to 9.">
                </p>
                <p class="field">
                    <label for="student-age">Student age</label>
                    <input type="number" id="student-age" name="age" min="5" max="18" required
                           title="Student age must be between 5 and 18.">
                </p>
                <p class="field">
                    <label for="subject">Choose a subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Choose a subject</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Science">Science</option>
                        <option value="English">English</option>
                        <option value="Social Studies">Social Studies</option>
                        <option value="Computer Studies">Computer Studies</option>
                    </select>
                </p>
                <fieldset>
                    <legend>Class mode</legend>
                    <input type="radio" id="mode-online" name="mode" value="Online" required>
                    <label for="mode-online">Online</label>
                    <input type="radio" id="mode-offline" name="mode" value="Offline">
                    <label for="mode-offline">Offline</label>
                </fieldset>
                <p class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" cols="40"></textarea>
                </p>
                <button type="submit">Submit Enquiry</button>
                <button type="reset">Reset Form</button>
            </form>
        </article>
    </main>
    <footer>
        <p>&copy; 2026 Bright Future Academy. All rights reserved.</p>
    </footer>
</body>
</html>
